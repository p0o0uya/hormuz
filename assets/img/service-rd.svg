<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Research and development lab with monitors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <g id="sparkle">
      <path d="M0 -11 L2.8 -2.8 L11 0 L2.8 2.8 L0 11 L-2.8 2.8 L-11 0 L-2.8 -2.8 Z"/>
    </g>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="306" cy="200" r="152" fill="#FFE9BD"/>

  <!-- gear -->
  <g transform="translate(516,92)">
    <g fill="#FFC24C">
      <rect x="-7" y="-50" width="14" height="22" rx="5"/>
      <rect x="-7" y="-50" width="14" height="22" rx="5" transform="rotate(45)"/>
      <rect x="-7" y="-50" width="14" height="22" rx="5" transform="rotate(90)"/>
      <rect x="-7" y="-50" width="14" height="22" rx="5" transform="rotate(135)"/>
      <rect x="-7" y="-50" width="14" height="22" rx="5" transform="rotate(180)"/>
      <rect x="-7" y="-50" width="14" height="22" rx="5" transform="rotate(225)"/>
      <rect x="-7" y="-50" width="14" height="22" rx="5" transform="rotate(270)"/>
      <rect x="-7" y="-50" width="14" height="22" rx="5" transform="rotate(315)"/>
    </g>
    <circle r="34" fill="#FFC24C" stroke="#29251D" stroke-width="5"/>
    <circle r="12" fill="#FFF3D6" stroke="#29251D" stroke-width="4"/>
  </g>

  <!-- ground shadows -->
  <ellipse cx="238" cy="312" rx="96" ry="10" fill="#EFDCB0"/>
  <ellipse cx="478" cy="312" rx="56" ry="9" fill="#EFDCB0"/>

  <!-- monitor -->
  <rect x="122" y="106" width="232" height="146" rx="14" fill="#FFFFFF" stroke="#29251D" stroke-width="6"/>
  <g stroke="#F0E4C6" stroke-width="3" stroke-linecap="round">
    <line x1="144" y1="152" x2="332" y2="152"/>
    <line x1="144" y1="188" x2="332" y2="188"/>
    <line x1="144" y1="224" x2="332" y2="224"/>
  </g>
  <polyline points="146,222 182,184 216,198 254,148 292,162 330,124"
            fill="none" stroke="#FFC24C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFC24C" stroke="#29251D" stroke-width="3.5">
    <circle cx="182" cy="184" r="6"/>
    <circle cx="254" cy="148" r="6"/>
    <circle cx="330" cy="124" r="6"/>
  </g>
  <!-- monitor stand -->
  <path d="M226 252 h24 l7 30 h-38 z" fill="#FFFFFF" stroke="#29251D" stroke-width="5" stroke-linejoin="round"/>
  <rect x="198" y="282" width="80" height="13" rx="6.5" fill="#FFFFFF" stroke="#29251D" stroke-width="5"/>

  <!-- flask -->
  <g transform="translate(478,206)">
    <path d="M-15 0 h30 v22 l21 42 a11 11 0 0 1 -10 15 h-52 a11 11 0 0 1 -10 -15 l21 -42 z"
          fill="#FFFFFF" stroke="#29251D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-27 44 h54 l9 20 a11 11 0 0 1 -10 15 h-52 a11 11 0 0 1 -10 -15 z" fill="#FFC24C"/>
    <rect x="-21" y="-7" width="42" height="11" rx="5.5" fill="#FFFFFF" stroke="#29251D" stroke-width="5"/>
    <circle cx="-9" cy="60" r="4" fill="#FFF3D5"/>
    <circle cx="9" cy="54" r="3" fill="#FFF3D5"/>
    <circle cx="1" cy="70" r="3" fill="#FFF3D5"/>
  </g>

  <!-- accents -->
  <use href="#sparkle" transform="translate(94,84)" fill="#FFC24C"/>
  <use href="#sparkle" transform="translate(408,150) scale(0.7)" fill="#D9971E"/>
  <circle cx="86" cy="180" r="5" fill="#FFC24C"/>
  <circle cx="560" cy="200" r="4" fill="#D9971E"/>
</svg>
