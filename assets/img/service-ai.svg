<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="AI GPU compute chip with neural network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1430"/>
      <stop offset="1" stop-color="#1a2f56"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a6b"/>
      <stop offset="1" stop-color="#102142"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#d9971e"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- circuit traces -->
  <g stroke="#2a4a80" stroke-width="2" fill="none" opacity="0.9">
    <path d="M250 200 H150 V120 H80"/>
    <path d="M250 200 H140 V290 H60"/>
    <path d="M390 200 H490 V110 H560"/>
    <path d="M390 200 H500 V300 H580"/>
    <path d="M320 130 V70 H260"/>
    <path d="M320 270 V340 H380"/>
  </g>
  <g fill="#4cc9ff">
    <circle cx="80" cy="120" r="5"/><circle cx="60" cy="290" r="5"/>
    <circle cx="560" cy="110" r="5"/><circle cx="580" cy="300" r="5"/>
    <circle cx="260" cy="70" r="5"/><circle cx="380" cy="340" r="5"/>
  </g>

  <!-- neural network nodes -->
  <g stroke="#4cc9ff" stroke-width="1.5" opacity="0.55">
    <line x1="120" y1="60" x2="200" y2="110"/><line x1="200" y1="110" x2="130" y2="180"/>
    <line x1="520" y1="50" x2="460" y2="120"/><line x1="460" y1="120" x2="540" y2="190"/>
    <line x1="200" y1="110" x2="250" y2="170"/><line x1="460" y1="120" x2="390" y2="170"/>
  </g>
  <g fill="#9fdcff">
    <circle cx="120" cy="60" r="6"/><circle cx="200" cy="110" r="6"/><circle cx="130" cy="180" r="6"/>
    <circle cx="520" cy="50" r="6"/><circle cx="460" cy="120" r="6"/><circle cx="540" cy="190" r="6"/>
  </g>

  <!-- chip -->
  <g>
    <!-- pins -->
    <g fill="#2a4a80">
      <rect x="266" y="116" width="10" height="16"/><rect x="292" y="116" width="10" height="16"/><rect x="318" y="116" width="10" height="16"/><rect x="344" y="116" width="10" height="16"/><rect x="370" y="116" width="10" height="16"/>
      <rect x="266" y="268" width="10" height="16"/><rect x="292" y="268" width="10" height="16"/><rect x="318" y="268" width="10" height="16"/><rect x="344" y="268" width="10" height="16"/><rect x="370" y="268" width="10" height="16"/>
      <rect x="236" y="146" width="16" height="10"/><rect x="236" y="172" width="16" height="10"/><rect x="236" y="198" width="16" height="10"/><rect x="236" y="224" width="16" height="10"/><rect x="236" y="250" width="16" height="10"/>
      <rect x="388" y="146" width="16" height="10"/><rect x="388" y="172" width="16" height="10"/><rect x="388" y="198" width="16" height="10"/><rect x="388" y="224" width="16" height="10"/><rect x="388" y="250" width="16" height="10"/>
    </g>
    <rect x="250" y="130" width="140" height="140" rx="12" fill="url(#chip)" stroke="#4cc9ff" stroke-width="2.5"/>
    <rect x="278" y="158" width="84" height="84" rx="10" fill="#0a1430" stroke="#ffc24c" stroke-width="2"/>
    <circle cx="320" cy="200" r="26" fill="url(#core)"/>
    <text x="320" y="207" font-family="Vazirmatn, Arial, sans-serif" font-size="24" font-weight="700" fill="#29251d" text-anchor="middle">AI</text>
  </g>
</svg>
