<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="AI GPU compute chip with neural network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <g id="sparkle">
      <path d="M0 -11 L2.8 -2.8 L11 0 L2.8 2.8 L0 11 L-2.8 2.8 L-11 0 L-2.8 -2.8 Z"/>
    </g>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="320" cy="200" r="152" fill="#FFE9BD"/>

  <!-- circuit traces -->
  <g stroke="#29251D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M245 170 H185 V110 H130"/>
    <path d="M245 230 H175 V292 H120"/>
    <path d="M395 170 H455 V104 H510"/>
    <path d="M395 230 H465 V296 H520"/>
    <path d="M292 125 V76 H244"/>
    <path d="M348 275 V326 H396"/>
  </g>
  <g fill="#FFC24C" stroke="#29251D" stroke-width="4">
    <circle cx="130" cy="110" r="7"/>
    <circle cx="120" cy="292" r="7"/>
    <circle cx="510" cy="104" r="7"/>
    <circle cx="520" cy="296" r="7"/>
    <circle cx="244" cy="76" r="7"/>
    <circle cx="396" cy="326" r="7"/>
  </g>

  <!-- neural nodes -->
  <g stroke="#29251D" stroke-width="3" opacity="0.45">
    <line x1="108" y1="66" x2="160" y2="96"/>
    <line x1="160" y1="96" x2="112" y2="150"/>
    <line x1="532" y1="66" x2="480" y2="96"/>
    <line x1="480" y1="96" x2="528" y2="150"/>
  </g>
  <g fill="#FFFFFF" stroke="#29251D" stroke-width="4">
    <circle cx="108" cy="66" r="7"/>
    <circle cx="160" cy="96" r="5.5"/>
    <circle cx="112" cy="150" r="5.5"/>
    <circle cx="532" cy="66" r="7"/>
    <circle cx="480" cy="96" r="5.5"/>
    <circle cx="528" cy="150" r="5.5"/>
  </g>

  <!-- chip pins -->
  <g fill="#29251D">
    <rect x="266" y="105" width="12" height="22" rx="6"/>
    <rect x="292" y="105" width="12" height="22" rx="6"/>
    <rect x="336" y="105" width="12" height="22" rx="6"/>
    <rect x="362" y="105" width="12" height="22" rx="6"/>
    <rect x="266" y="273" width="12" height="22" rx="6"/>
    <rect x="292" y="273" width="12" height="22" rx="6"/>
    <rect x="336" y="273" width="12" height="22" rx="6"/>
    <rect x="362" y="273" width="12" height="22" rx="6"/>
    <rect x="223" y="146" width="22" height="12" rx="6"/>
    <rect x="223" y="172" width="22" height="12" rx="6"/>
    <rect x="223" y="216" width="22" height="12" rx="6"/>
    <rect x="223" y="242" width="22" height="12" rx="6"/>
    <rect x="395" y="146" width="22" height="12" rx="6"/>
    <rect x="395" y="172" width="22" height="12" rx="6"/>
    <rect x="395" y="216" width="22" height="12" rx="6"/>
    <rect x="395" y="242" width="22" height="12" rx="6"/>
  </g>

  <!-- chip body -->
  <rect x="245" y="125" width="150" height="150" rx="20" fill="#FFFFFF" stroke="#29251D" stroke-width="6"/>
  <rect x="280" y="160" width="80" height="80" rx="14" fill="#FFF6E3" stroke="#D9971E" stroke-width="3"/>
  <circle cx="320" cy="200" r="33" fill="#FFC24C" stroke="#29251D" stroke-width="5"/>
  <text x="320" y="210" font-family="Vazirmatn, Arial, sans-serif" font-size="28" font-weight="700" fill="#29251D" text-anchor="middle">AI</text>

  <!-- accents -->
  <use href="#sparkle" transform="translate(160,330) scale(0.8)" fill="#FFC24C"/>
  <use href="#sparkle" transform="translate(486,336) scale(0.65)" fill="#D9971E"/>
</svg>
