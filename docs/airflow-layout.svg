<text x="732" y="324">→ coarse raw-media stage</text>
<text x="732" y="354">→ pleated fine-media stage</text>
<text x="732" y="384">→ supply fan → front aisle</text>
<text x="732" y="414">Rear aisle → return fan</text>
<text x="732" y="444">→ cooling unit return</text>
<text x="715" y="494" class="small">Filter bank: 2 × 2 cassettes per stage.</text>
<text x="715" y="519" class="small">Allow separate service/mechanical space.</text>
<text x="715" y="544" class="small">Main ducts: 6 m each including external lead.</text>
<text x="715" y="569" class="small">Branches: 1 m each; eight total.</text>
<text x="715" y="602" class="small">Confirm actual doors, rack sizes and ceiling.</text>
