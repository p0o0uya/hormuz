<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030" role="img" aria-labelledby="title desc">
<title id="title">Four-rack airflow: dimensioned preliminary room plan and section</title>
<desc id="desc">A 4.5 by 4 metre room has four assumed 600 by 1200 millimetre racks in a row. The cold aisle is 1.6 metres deep, the hot aisle 1.2 metres, and each row end has 1.05 metres access. Supply and return ducts are above the aisles. Two filter stages and fans occupy separate external mechanical space.</desc>
