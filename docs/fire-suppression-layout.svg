 <text x="235" y="260" font-size="13">Heads beneath roof · y=2.8–4.0 m</text>
 <text x="237" y="614" font-size="17" font-weight="bold">Cold / front aisle</text>
 <text x="237" y="636" font-size="14">y=0–1.6 m · keep egress clear</text>
