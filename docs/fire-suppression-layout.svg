<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="890" viewBox="0 0 1120 890" role="img" aria-labelledby="title desc">
<title id="title">Hormuz preliminary water-mist suppression layout</title>
<desc id="desc">Four rack bodies in a 4.5 by 4 metre room with four candidate ceiling heads and two candidate heads beneath the hot aisle roof. A tank, pump and pre-action valve outside the room feed the heads. Locations, quantities and tank capacity are budget assumptions requiring manufacturer engineering.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b43c35"/></marker>
