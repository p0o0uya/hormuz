 <g id="aisleHead"><rect x="-13" y="-13" width="26" height="26" rx="3" fill="#fff4d4" stroke="#b43c35" stroke-width="3"/><path d="M-7 0 H7 M0 -7 V7" stroke="#b43c35" stroke-width="2"/></g>
</defs>
<rect width="1120" height="890" fill="#f5f7fa"/>
<g font-family="Arial, sans-serif" fill="#203047">
 <text x="40" y="45" font-size="26" font-weight="bold">Hormuz · Tank-fed water-mist concept</text>
 <text x="40" y="76" font-size="16">18 m² rack room · 13 October 2026 · Concept for specialist quotation</text>
 <rect x="40" y="95" width="1040" height="44" rx="6" fill="#fff0df"/>
 <text x="56" y="123" font-size="17" font-weight="bold">NOT FOR INSTALLATION — Head positions, pipe sizes and tank/pump duty require OEM design.</text>
